<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1010" />
  <meta name="description" content="ALP FIT: kişisel antrenman ve beslenme takip uygulaması." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="ALP FIT" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css?v=2.2" />
  <title>ALP FIT Cloud 2.2 · Antrenman & Beslenme</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <button class="brand" type="button" data-nav="home" aria-label="Ana sayfaya git">
        <span class="brand-mark">A<span class="brand-pip">•</span></span>
        <span class="brand-text">ALP <strong>FIT</strong><small>DAHA İYİSİNE DEVAM</small></span>
      </button>
      <div class="header-right"><span id="sync-status" class="sync-status" role="status" aria-live="polite"></span><span id="today-chip" class="date-chip"></span><button class="icon-button" data-nav="settings" title="Ayarlar" aria-label="Ayarlar">⚙</button></div>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav class="bottom-nav" aria-label="Ana menü" id="bottom-nav"></nav>
  </div>
  <div id="timer-floating" class="timer-floating" hidden></div>
  <div id="dialog-backdrop" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-button" data-close-dialog aria-label="Pencereyi kapat">✕</button></div>
      <div id="dialog-content"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input id="import-file" type="file" accept=".json,application/json" hidden />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./config.js?v=2.0" defer></script>
  <script src="./importer.js?v=2.1" defer></script>
  <script src="./app.js?v=2.2" defer></script>
</body>
</html>
